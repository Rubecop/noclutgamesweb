<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noclut Games</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Georgia, serif;
      background: #1a120b;
      overflow-x: hidden;
      text-align: center;
    }

    /* Layout para que el footer quede abajo siempre */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Fondo estilo PHB */
    .background {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #f7ebd0 0%, #d7b57a 70%, #b8894f 100%);
      overflow: hidden;
    }

    /* manchas tipo papel */
    .background::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 25%, rgba(120, 70, 30, 0.18), transparent 45%),
        radial-gradient(circle at 75% 70%, rgba(80, 40, 20, 0.16), transparent 50%),
        radial-gradient(circle at 60% 15%, rgba(110, 60, 20, 0.12), transparent 55%);
      pointer-events: none;
      z-index: 0;
    }

    /* viñeta */
    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, transparent 55%, rgba(30, 15, 5, 0.75) 100%);
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 5;
      padding: 25px 20px;
      background: linear-gradient(to bottom, #4a2510, #2b1308);
      border-bottom: 6px solid #7a4a1e;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.7);
      text-align: center;
    }

    header img {
      display: block;
      margin: 0 auto;
      max-width: 200px;
      height: auto;
      filter: drop-shadow(0px 0px 10px rgba(0,0,0,0.7));
    }

    /* Contenedor central */
    .container {
      position: relative;
      z-index: 5;
      max-width: 920px;
      margin: 70px auto;
      padding: 55px 30px;
      background: rgba(250, 240, 215, 0.92);
      border-radius: 10px;
      border: 4px solid rgba(80, 40, 15, 0.55);
      box-shadow: 0px 0px 35px rgba(0,0,0,0.45);
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 16px;
      border: 2px solid rgba(90, 50, 20, 0.35);
      pointer-events: none;
    }

    .game-logo {
      display: block;
      margin: 0 auto 25px auto;
      max-width: 420px;
      width: 90%;
      height: auto;
      filter: drop-shadow(0px 0px 12px rgba(0,0,0,0.55));
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 15px;
      color: #4b2410;
      letter-spacing: 1px;
    }

    p {
      font-size: 1.2rem;
      max-width: 720px;
      margin: auto;
      line-height: 1.7;
      color: #2a1a10;
    }

    .divider {
      margin: 50px auto;
      width: 80%;
      height: 3px;
      background: linear-gradient(to right, transparent, #7a4a1e, transparent);
      border-radius: 50px;
    }

    /* Botón Steam */
    .steam-link {
      margin-top: 40px;
    }

    .steam-link a img {
      width: 270px;
      max-width: 85%;
      border-radius: 22px;
      border: 3px solid rgba(80, 40, 15, 0.65);
      box-shadow: 0px 10px 22px rgba(0,0,0,0.55);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .steam-link a img:hover {
      transform: scale(1.07);
      box-shadow: 0px 0px 28px rgba(255, 210, 130, 0.9);
    }

    footer {
      position: relative;
      z-index: 5;
      padding: 18px;
      background: linear-gradient(to bottom, #2b1308, #160a05);
      border-top: 6px solid #7a4a1e;
      font-size: 0.95rem;
      color: #f5e6c4;
    }

    /* ========================= */
    /* DADOS POR ENCIMA DE TODO */
    /* ========================= */

    .dice {
  position: absolute;


  opacity: 0.95;
  z-index: 4;
  pointer-events: none;
  filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.45));
  transform-origin: center center;
}

@keyframes diceSpinRight {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

@keyframes diceSpinLeft {
  from { transform: rotate(0deg); }
  to   { transform: rotate(-360deg); }
}
    .dice1 {  width: 110px;  height: 110px; top: 120px; left: 70px; animation: diceSpinRight 3.2s linear infinite;}
    .dice2 {  width: 120px;  height: 120px; top: 150px; right: 90px;animation: diceSpinLeft 2.8s linear infinite; }
    .dice3 {  width: 130px;  height: 130px; bottom: 150px; left: 140px;animation: diceSpinLeft 2.6s linear infinite; }
    .dice4 {  width: 90px;  height: 90px; bottom: 280px; right: 160px;animation: diceSpinRight 2.2s linear infinite; }
    .dice5 {   width: 70px;  height: 70px;top: 320px; left: 60px; animation: diceSpinRight 2s linear infinite;}
    .dice6 {   width: 150px;  height: 150px;bottom: 40px; right: 120px;animation: diceSpinLeft 2.4s linear infinite;  }

    /* Responsive */
    @media (max-width: 900px) {
      .dice {
        width: 75px;
        height: 75px;
      }

      h1 {
        font-size: 2.3rem;
      }

      .container {
        margin: 50px 15px;
        padding: 45px 20px;
      }
    }

    @media (max-width: 600px) {
      .dice {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <header>
      <img src="Logos/logo noclut.png" alt="Logo de la empresa">
    </header>

    <main class="background">

      <!-- Dados dentro del body y por encima del background -->
      <img src="Dados/d20.png" class="dice dice1" alt="Dado">
      <img src="Dados/d12.png" class="dice dice2" alt="Dado">
      <img src="Dados/d6.png" class="dice dice3" alt="Dado">
      <img src="Dados/d8.png" class="dice dice4" alt="Dado">
      <img src="Dados/d10.png" class="dice dice5" alt="Dado">
      <img src="Dados/d4.png" class="dice dice6" alt="Dado">

      <div class="container">
        <img src="Logos/logoSurdice.PNG" alt="Logo del juego" class="game-logo">

        <h1>Survive the waves</h1>

        <p>
          Select your class, roll the dice and kill your enemies.
        </p>

        <div class="divider"></div>

        <div class="steam-link">
          <a href="https://store.steampowered.com/" target="_blank">
            <img src="Logos/steam.png" alt="Disponible en Steam">
          </a>
        </div>
      </div>

    </main>

    <footer>
      © 2026 - Noclut Games - All rights reserved.
    </footer>

  </div>

</body>
</html>
